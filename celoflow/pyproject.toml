[project]
name = "celoflow"
version = "0.1.0"
description = "ERC-8004 Remittance Intent Agent for Celo — Contextwise-based"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "contextwise>=0.3.0",
    "web3>=7.0.0",
    "eth-account>=0.13.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "dstack-sdk>=0.5.3",
    "apscheduler>=3.10.0",
    "mcp[cli]>=1.26.0",
    "fastapi>=0.129.0",
    "uvicorn>=0.41.0",
    "pyjwt[crypto]>=2.11.0",
]

[project.optional-dependencies]
tee = ["dstack-sdk>=0.5.0"]
notifications = ["twilio>=9.0.0"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.uv.sources]

contextwise = { path = "./contextwise-0.3.0-py3-none-any.whl" }

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
]
