[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
cache = true
cache_path = "cache"
broadcast = "broadcast"
gas_reports = ["*"]
auto_detect_solc = true

optimizer = true
optimizer_runs = 200
via_ir = true

fs_permissions = [{ access = "read-write", path = "./" }]


[profile.default.rpc_endpoints]
celo_sepolia = "${CELO_SEPOLIA_RPC_URL}"
celo_mainnet = "${CELO_MAINNET_RPC_URL}"

[profile.default.etherscan]
celo_sepolia = { key = "${CELOSCAN_API_KEY}", url = "https://api-sepolia.celoscan.io/api" }
celo_mainnet = { key = "${CELOSCAN_API_KEY}", url = "https://api.celoscan.io/api" }

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = true
int_types = "preserve"

[rpc_endpoints]
celo_sepolia = "${CELO_SEPOLIA_RPC_URL}"
celo_mainnet = "${CELO_MAINNET_RPC_URL}"

[etherscan]
celo_sepolia = { key = "${CELOSCAN_API_KEY}" }
celo_mainnet = { key = "${CELOSCAN_API_KEY}" }
